services:
  grafana:
    user: root
    container_name: 'greennode-vmonitor-datasource'

    build:
      context: ./.config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-13.1.1}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}

    ports:
      - 3000:3000/tcp
      - 2345:2345/tcp

    security_opt:
      - 'apparmor:unconfined'
      - 'seccomp:unconfined'
    cap_add:
      - SYS_PTRACE

    volumes:
      - ./dist:/var/lib/grafana/plugins/greennode-vmonitor-datasource
      - ./provisioning:/etc/grafana/provisioning
      - .:/root/greennode-vmonitor-datasource

    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.greennode-vmonitor-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: greennode-vmonitor-datasource
      VM_CLIENT_ID: ${VM_CLIENT_ID:-}
      VM_CLIENT_SECRET: ${VM_CLIENT_SECRET:-}
